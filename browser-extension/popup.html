<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RESLU Product Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">RESLU SPEC SYSTEM</p>
      <h1>Import this product</h1>
      <p id="context" class="context">Finding your most recent RESLU project…</p>
      <div id="status" class="status" role="status">Ready to read this page when you confirm.</div>
      <button id="import" type="button">Review in RESLU</button>
      <p class="privacy">Only normalized product details are handed to RESLU. Supplier cookies and page HTML are never uploaded.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
